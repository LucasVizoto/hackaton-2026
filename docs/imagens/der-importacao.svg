    </text>
  </g>
  <g>
    <rect x="40" y="840" width="1160" height="140" fill="#f4f0e5" stroke="#24352e" stroke-width="1.8" />
    <text x="620.0" y="903.0" fill="#24352e" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle">
      <tspan x="620.0" dy="0">Sem identidade de caminhão ou tempos históricos. Não somar Peso repetido. Consultas usam apenas batch.active. Não há</tspan>
      <tspan x="620.0" dy="24">relação automática entre histórico documental e boletim operacional.</tspan>
    </text>
  </g>
