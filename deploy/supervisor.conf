[program:cocapec-postgres]
command=/usr/lib/postgresql/17/bin/postgres -D /var/lib/postgresql/17/main -c config_file=/etc/postgresql/17/main/postgresql.conf
user=postgres
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=INT
stopwaitsecs=120
stdout_logfile=/var/log/cocapec/postgres.log
redirect_stderr=true
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

[program:cocapec-redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --protected-mode yes --port 6379 --save "" --appendonly no --dir /srv/cocapec/shared/redis
user=cocapec
priority=15
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/var/log/cocapec/redis.log
redirect_stderr=true
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

[program:cocapec-api]
command=/srv/cocapec/current/backend/.venv/bin/python /srv/cocapec/current/deploy/api-start.py
user=cocapec
directory=/srv/cocapec/current
environment=HOME="/srv/cocapec",DJANGO_SETTINGS_MODULE="config.settings_production",PYTHONUNBUFFERED="1"
priority=20
autostart=true
autorestart=true
startsecs=10
startretries=5
stopsignal=TERM
stopwaitsecs=45
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/cocapec/api.log
redirect_stderr=true
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

[program:cocapec-web]
command=/usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
user=caddy
environment=HOME="/var/lib/caddy",XDG_DATA_HOME="/var/lib/caddy",XDG_CONFIG_HOME="/var/lib/caddy"
priority=30
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/var/log/cocapec/caddy.log
redirect_stderr=true
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
