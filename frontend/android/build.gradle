// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Cordova's test runtime resolves stdlib 1.8.22 with legacy JDK extensions.
// Keep their versions aligned without editing Capacitor's generated project.
project(':capacitor-cordova-android-plugins') {
    plugins.withId('com.android.library') {
        dependencies {
            androidTestImplementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
